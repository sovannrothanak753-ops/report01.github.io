{k:'t4',h:'IV. ផែនការគោលដៅប្រចាំខែថ្មី',c:['គោលដៅប្រចាំខែថ្មី','អ្នកទទួលខុសត្រូវ']}];
let D,edit=true;
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!D.t1)D=JSON.parse(JSON.stringify(D0));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function ce(k,v,tag='span'){return `<${tag} contenteditable="${edit}" data-k="${k}">${esc(v)}</${tag}>`}
function render(){
 let h=`<div class="hd">${D.logo?`<img src="${D.logo}" alt="logo">`:''}<div class="o">${ce('org',D.org,'div')}</div><div class="e">${ce('orgEn',D.orgEn)}</div><div>${ce('slogan',D.slogan,'div')}</div></div><div class="body"><h2 class="t">${ce('title',D.title)}</h2><div class="meta">
 <b>ឈ្មោះ៖</b><div>${ce('name',D.name)}</div><b>ចាប់ផ្តើម៖</b><div>${ce('from',D.from)} ដល់ ${ce('to',D.to)}</div><b>មុខតំណែង៖</b><div>${ce('pos',D.pos)}</div><b>ផ្នែក៖</b><div>${ce('dept',D.dept)}</div></div>`;
 S.forEach(s=>{h+=`<h3>${s.h}</h3><div class="tw"><table class="${s.s3?'s3':''}"><tr><th>N</th>${s.c.map(c=>`<th>${c}</th>`).join('')}<th class="no" style="width:30px"></th></tr>`;
  D[s.k].forEach((r,i)=>{h+=`<tr><td class="n">${i+1}</td>${s.c.map((_,j)=>`<td>${ce(s.k+'.'+i+'.'+j,r[j],'div')}</td>`).join('')}<td class="no">${edit?`<button class="x" data-del="${s.k}.${i}">✕</button>`:''}</td></tr>`});
  h+=`</table></div>${edit?`<button class="btn add no" data-add="${s.k}">+ បន្ថែមជួរ</button>`:''}`});
 h+=`<div class="ft">${ce('foot',D.foot,'div')}</div></div>`;
 $('#doc').innerHTML=h;document.body.classList.toggle('view',!edit);
 $('#bEdit').textContent='✏️ Edit: '+(edit?'បើក':'បិទ');
}
$('#doc').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const p=k.split('.');
 if(p.length==1)D[k]=e.target.innerText;else D[p[0]][+p[1]][+p[2]]=e.target.innerText;save()});
$('#doc').addEventListener('click',e=>{const a=e.target.dataset;
 if(a.add){const s=S.find(x=>x.k==a.add);D[a.add].push(s.c.map(()=>''));save();render()}
 if(a.del){const[k,i]=a.del.split('.');D[k].splice(+i,1);save();render()}});
$('#bEdit').onclick=()=>{edit=!edit;render()};
$('#fLogo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{D.logo=r.result;save();render();toast('ប្តូរ Logo រួចរាល់')};r.readAsDataURL(f)};
$('#bPrint').onclick=()=>{try{window.print()}catch(e){toast('Print មិនអាចប្រើបាន')}};
$('#bPdf').onclick=()=>{toast('ជ្រើស “Save as PDF” ក្នុងផ្ទាំង Print');try{window.print()}catch(e){}};
async function dl(name,data){try{const d=await claude.use('downloads');if(!d)return toast('មិនអាចទាញយកបាន');await d.save({filename:name,data});bump(name.split('.').pop().toUpperCase())}catch(e){if(e&&e.code!=='declined')toast('Error: '+(e.message||e))}}
$('#bJson').onclick=()=>dl('report.json',new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));
$('#fJson').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!j.t1)throw 0;D=j;save();render();toast('នាំចូលរួចរាល់')}catch(x){toast('ឯកសារ JSON មិនត្រឹមត្រូវ')}})};
/* DOCX (minimal, built with JSZip) */
const fx='<w:rFonts w:ascii="Khmer OS Battambang" w:hAnsi="Khmer OS Battambang" w:cs="Khmer OS Battambang"/>';
const wp=(t,o={})=>`<w:p><w:pPr>${o.c?'<w:jc w:val="center"/>':''}</w:pPr><w:r><w:rPr>${fx}${o.b?'<w:b/>':''}${o.col?`<w:color w:val="${o.col}"/>`:''}<w:sz w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${esc(t)}</w:t></w:r></w:p>`;
const wtc=(t,hd)=>`<w:tc><w:tcPr>${hd?'<w:shd w:val="clear" w:fill="C00000"/>':''}</w:tcPr>${wp(t,{b:hd,col:hd?'FFFFFF':null,sz:20})}</w:tc>`;
const wt=(cols,rows)=>`<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="single" w:sz="4" w:color="999999"/>`).join('')}</w:tblBorders></w:tblPr><w:tr>${['N',...cols].map(c=>wtc(c,1)).join('')}</w:tr>${rows.map((r,i)=>`<w:tr>${[i+1,...r].map(c=>wtc(String(c))).join('')}</w:tr>`).join('')}</w:tbl>`;
$('#bDocx').onclick=async()=>{
 if(!window.JSZip)return toast('JSZip មិនទាន់ដំណើរការ');
 let b=wp(D.org,{c:1,b:1,sz:30,col:'C00000'})+wp(D.orgEn,{c:1})+wp(D.slogan,{c:1,sz:20})+wp(D.title,{c:1,b:1,sz:40,col:'C00000'})+wp('ឈ្មោះ៖ '+D.name)+wp(`ចាប់ផ្តើម ${D.from} ដល់ ${D.to}`)+wp('មុខតំណែង៖ '+D.pos)+wp('ផ្នែក៖ '+D.dept);
 S.forEach(s=>{b+=wp(s.h,{b:1,sz:26,col:'C00000'})+wt(s.c,D[s.k])+wp('')});
 b+=wp(D.foot,{c:1,sz:16});
 const z=new JSZip();
 z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
 z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
 z.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+b+'<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="1000" w:right="1000" w:bottom="1000" w:left="1000"/></w:sectPr></w:body></w:document>');
 dl('report.docx',await z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}));
};
/* PROFILE */
const PK='itreport_prof',TC={PDF:'#e52d27',DOCX:'#1565c0',PRINT:'#f5841f',JSON:'#0f9b8e'};
let P;try{P=JSON.parse(localStorage.getItem(PK))}catch(e){}
P=Object.assign({name:'សុវណ្ណ រតនៈ',role:'IT Support',start:'2026-03-10',age:'',gender:'',bio:'IT Support នៅ Narith Master-IT Education ទទួលបន្ទុកតម្លើងកម្មវិធី, Maintenance កុំព្យូទ័រ, ជួយគ្រូនិងសិស្ស និងគ្រប់គ្រងស្តុក។',photo:'',count:0,types:{},log:[]},P||{});
function psave(){try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){toast('រក្សាទុករូបមិនបាន')}}
function countUp(el,to){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function phead(){$('#pnameH').textContent=P.name||'—';$('#proleH').textContent=P.role||'—'}
function prender(){phead();
 const im=$('#pimg');im.hidden=!P.photo;if(P.photo)im.src=P.photo;$('#pav').hidden=!!P.photo;
 countUp($('#pnum'),P.count);
 $('#pchips').innerHTML=Object.keys(P.types).map((k,i)=>`<span style="background:${TC[k]||'#555'};animation-delay:${i*.1}s">${k}: ${P.types[k]}</span>`).join('')||'<span style="background:#78909c">មិនទាន់មាន Report</span>';
 $('#plog').innerHTML=P.log.map((l,i)=>`<div style="animation-delay:${i*.06}s">🕒 ${esc(l)}</div>`).join('')}
function bump(t){P.count++;P.types[t]=(P.types[t]||0)+1;P.log.unshift(t+' · '+new Date().toLocaleString('en-GB'));P.log=P.log.slice(0,8);psave();toast('✔ Report ទី '+P.count);if(!$('#prof').hidden)prender()}
$('#bPdf').addEventListener('click',()=>bump('PDF'));$('#bPrint').addEventListener('click',()=>bump('PRINT'));
$('#goProf').onclick=()=>{$('#sheet').hidden=true;$('#prof').hidden=false;document.querySelectorAll('[data-p]').forEach(e=>e.value=P[e.dataset.p]??'');prender();window.scrollTo(0,0)};
$('#pBack').onclick=()=>{$('#prof').hidden=true;$('#sheet').hidden=false};
document.querySelectorAll('[data-p]').forEach(e=>{const h=()=>{P[e.dataset.p]=e.value;psave();phead()};e.addEventListener('input',h);e.addEventListener('change',h)});
$('#fPhoto').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=360;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,360,360);P.photo=c.toDataURL('image/jpeg',.85);psave();prender();toast('ប្តូររូបរួចរាល់')};im.src=URL.createObjectURL(f)};
$('#pcard').addEventListener('mousemove',e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.transform=`perspective(900px) rotateY(${((e.clientX-r.left)/r.width-.5)*5}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*5}deg)`});

function tryLogin(){
 if($('#u').value.trim()==='Nak123'&&$('#pw').value==='123'){$('#err').textContent='';$('#go').textContent='✔ ជោគជ័យ';try{sessionStorage.setItem('ok','1')}catch(e){}enter()}
 else{$('#err').textContent='⚠ Username ឬ Password មិនត្រឹមត្រូវ';const b=$('#lf');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}
